name: Build LevelsRanks

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: { }

env:
  DOTNET_VERSION: "8.0.x"
  CONFIGURATION: Release
  STAGE: dist/addons/counterstrikesharp

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # LevelsRanksApi (контракт) + LVL Core (реализация) + все не-VIP модули.
      # Собираем решение целиком один раз - если где-то реальная ошибка
      # компиляции C#, она вся будет видна тут одним списком, а не по частям
      # в отдельных publish-шагах ниже.
      - name: Restore
        run: dotnet restore "LevelsRanks.sln"

      - name: Build Core + modules
        run: dotnet build "LevelsRanks.sln" -c ${{ env.CONFIGURATION }} --no-restore

      - name: Check for VipCoreApi.dll
        id: vipcore
        run: |
          if [ -f "libs/VipCoreApi.dll" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::libs/VipCoreApi.dll not found - skipping VIP-модули (CS2-VIP-LR-ExperienceMultiplier, CS2_VIP_LR_CustomFakeRank). See libs/README.md."
          fi

      # ВАЖНО: каждый проект публикуется в СВОЮ папку через `dotnet publish -o`,
      # а не копируется через `cp bin/.../*.dll`. Раньше скрипт собирал путь к
      # bin-папке из имени .csproj (без расширения), а не из реальной папки
      # проекта - для модулей с квадратными скобками в имени файла
      # ("[LR] Module - ExStats Hits.csproj" и т.п.) это давало несуществующий
      # путь, и `cp` падал с "No such file or directory". Плюс у FakeRank два
      # проекта (FakeRanksApi.csproj и "[LR] Module - FakeRank.csproj") лежат
      # в одной папке и собираются в один общий bin/ - наивный `cp *.dll`
      # захватил бы туда и FakeRanksApi.dll, который должен жить только в
      # shared/ (иначе PluginCapability падает с ошибкой приведения типов
      # между разными копиями одной и той же сборки).
      # `dotnet publish` этого избегает: у каждого проекта своя выходная
      # папка, и Private=false / ExcludeAssets=runtime на ProjectReference
      # (уже стоит в .csproj) означает, что разделяемые контракты
      # (LevelsRanksApi.dll, FakeRanksApi.dll) туда не копируются.
      - name: Publish shared contracts
        run: |
          set -e
          dotnet publish "Api/LevelsRanksApi.csproj" -c ${{ env.CONFIGURATION }} --no-restore -o "$STAGE/shared/LevelsRanksApi"
          dotnet publish "modules/CS2-LR-FakeRank/FakeRanksApi.csproj" -c ${{ env.CONFIGURATION }} --no-restore -o "$STAGE/shared/FakeRanksApi"

      - name: Publish Core
        run: dotnet publish "Core/LVL Core.csproj" -c ${{ env.CONFIGURATION }} --no-restore -o "$STAGE/plugins/LVL Core"

      - name: Publish modules
        run: |
          set -e
          dotnet publish "modules/CS2-LR-FakeRank/[LR] Module - FakeRank.csproj" -c ${{ env.CONFIGURATION }} --no-restore -o "$STAGE/plugins/LR Module - FakeRank"
          dotnet publish "modules/CS2-LR-ExStats-Hits/[LR] Module - ExStats Hits.csproj" -c ${{ env.CONFIGURATION }} --no-restore -o "$STAGE/plugins/LR Module - ExStats Hits"
          dotnet publish "modules/CS2-LR-ExStats-Weapons/[LR] Module - ExStats Weapons.csproj" -c ${{ env.CONFIGURATION }} --no-restore -o "$STAGE/plugins/LR Module - ExStats Weapons"
          dotnet publish "modules/CS2-LR-Module-Tag/[LR] Module - Tag.csproj" -c ${{ env.CONFIGURATION }} --no-restore -o "$STAGE/plugins/LR Module - Tag"

      # VIP-модули зависят от стороннего VipCoreApi.dll, который не хранится в
      # репозитории (см. libs/README.md). Публикуем их отдельно и не роняем
      # остальную сборку, если файла нет.
      - name: Publish VIP modules
        if: steps.vipcore.outputs.present == 'true'
        run: |
          set -e
          dotnet publish "modules/CS2-VIP-LR-ExperienceMultiplier/[VIP] [LR] ExperienceMultiplier.csproj" -c ${{ env.CONFIGURATION }} -o "$STAGE/plugins/VIP LR ExperienceMultiplier"
          dotnet publish "modules/CS2_VIP_LR_CustomFakeRank/VIP_CustomFakeRank.csproj" -c ${{ env.CONFIGURATION }} -o "$STAGE/plugins/VIP CustomFakeRank"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LevelsRanks-${{ github.sha }}
          path: dist/**
          if-no-files-found: error

      - name: Create release zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dist
          zip -r "../LevelsRanks-${{ github.ref_name }}.zip" .

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LevelsRanks-${{ github.ref_name }}.zip
